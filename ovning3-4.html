    <h2>document.getElementById</h2>
  
    <!-- En textruta med händelsen onclick, som anropar funktionen welcome -->
    <input id="namn" type="text" value="Nisse Nilsson">

    <script>
        // Skriv i textruta, med hjälp av attributet value
       document.getElementById("namn").value = "Eva Andersson";

    </script>

</body>
</html>
